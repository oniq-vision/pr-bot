name: Deploy Azure Functions (TS v4)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run build
      - name: Archive app
        run: cd dist && zip -r ../release.zip .
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZ_FUNCTIONAPP_NAME }}
          package: release.zip
          publish-profile: ${{ secrets.AZ_FUNCTIONAPP_PUBLISH_PROFILE }}
